; ============================================================
;  Диалплан: внутренние звонки 11111 <-> 11119.
;  Сначала абонентам проигрывается уведомление о записи,
;  только потом начинается запись и мост.
; ============================================================

[general]
static=yes

[globals]
; Каталог записей (общий том, смонтированный в /audio_records)
RECORD_DIR=/audio_records

; ------------------------------------------------------------
; Внутренний контекст: звонки между экстеншенами 1111X
; ------------------------------------------------------------
[internal]
exten => _1111X,1,NoOp(Incoming call ${CALLERID(num)} -> ${EXTEN})
 ; База имени файлов: /audio_records/20261010-142233_11111_to_11119
 same => n,Set(BASE=${RECORD_DIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_${CALLERID(num)}_to_${EXTEN})
 ; Кому звонили (в hangup handler переменная EXTEN недоступна)
 same => n,Set(TO_EXTEN=${EXTEN})
 ; Регистрируем hangup handler — сработает после завершения звонка
 same => n,Set(CHANNEL(hangup_handler_push)=call-end,s,1)
 ; Уведомление звонящего ДО соединения (слышит звонящий, пока ждёт)
 same => n,Playback(custom/notice)
 same => n,Set(NOTICE_PLAYED=1)
 same => n,Set(NOTICE_TIME=${EPOCH})
 ; После ответа уведомление слышит вызываемый ([accepted]), вызов ставится
 ; на запись только после него
 same => n,Dial(PJSIP/${EXTEN},60,U(accepted^${BASE}))
 same => n,Hangup()

; ------------------------------------------------------------
; Called-side subroutine: уведомление отвечающему, затем запись.
; BASE приходит аргументом через U(accepted^${BASE})
; ------------------------------------------------------------
[accepted]
exten => s,1,NoOp(Notice to callee, base ${ARG1})
 same => n,Set(BASE=${ARG1})
 same => n,Playback(custom/notice)
 same => n,MixMonitor(${BASE}_mix.wav,br(${BASE}_caller.wav)t(${BASE}_callee.wav))
 same => n,Return()

; ------------------------------------------------------------
; Hangup handler: после завершения звонка пишет метаданные
; (.meta.json рядом с записями). Дальше их подхватывает
; recorder-notifier: стерео-склейка + вебхук ИИ-агенту.
; ------------------------------------------------------------
[call-end]
exten => s,1,NoOp(Call ended: ${BASE} status=${DIALSTATUS})
 same => n,System(/usr/local/bin/call-meta.sh "${BASE}" "${CALLERID(num)}" "${TO_EXTEN}" "${UNIQUEID}" "${DIALSTATUS}" "${ANSWEREDTIME}" "${NOTICE_PLAYED}" "${NOTICE_TIME}")
 same => n,Return()
