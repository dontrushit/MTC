; ============================================================
;  PJSIP: транспорт + два внутренних экстеншена
;  11111 — абонент А (например, Android)
;  11119 — абонент Б (например, iPhone)
; ============================================================

; ------------------------------------------------------------
; Транспорт: слушаем все интерфейсы (в т.ч. tailscale0)
; ------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ------------------------------------------------------------
; Шаблоны (чтобы не дублировать настройки)
; ------------------------------------------------------------

; Общие параметры эндпоинта за NAT/Tailscale
[endpoint-demo]!
type=endpoint
context=internal
disallow=all
allow=opus            ; приоритетный кодек (есть в современных сборках)
allow=alaw
allow=ulaw
; Клиенты приходят через Tailscale/мобильные сети — включаем обход NAT
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
dtmf_mode=rfc4733

; Шаблон аутентификации (пароль задаётся в секции экстеншена)
[auth-demo]!
type=auth
auth_type=userpass

; Шаблон регистрации: до 2 устройств, перерегистрация заменяет устаревший контакт
[aor-demo]!
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=60

; ------------------------------------------------------------
; Экстеншен 11111 — абонент А
; ------------------------------------------------------------
[11111](endpoint-demo)
auth=11111
aors=11111
callerid=Abonent A <11111>

[11111](auth-demo)
username=11111
password=Dm0-1111x-K7qZ      ; <-- смените на свой пароль перед продакшеном

[11111](aor-demo)

; ------------------------------------------------------------
; Экстеншен 11119 — абонент Б
; ------------------------------------------------------------
[11119](endpoint-demo)
auth=11119
aors=11119
callerid=Abonent B <11119>

[11119](auth-demo)
username=11119
password=Dm0-1119x-P4wN      ; <-- смените на свой пароль перед продакшеном

[11119](aor-demo)
